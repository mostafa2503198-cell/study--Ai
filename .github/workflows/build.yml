name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name study_ai app
      - run: cp pubspec.yaml app/pubspec.yaml && cp lib/main.dart app/lib/main.dart
      - run: sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><application|' android/app/src/main/AndroidManifest.xml
        working-directory: app
      - run: flutter pub get && flutter build apk --release
        working-directory: app
      - uses: actions/upload-artifact@v4
        with:
          name: study-ai-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
